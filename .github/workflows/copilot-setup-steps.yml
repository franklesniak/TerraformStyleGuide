name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - .github/workflows/.npmrc
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/Invoke-LockedPythonHook.ps1
      - .github/workflows/lint-staged-markdown.mjs
      - .github/workflows/npm-shrinkwrap.json
      - .github/workflows/package.json
      - .github/workflows/package-lock.json
      - .npmrc
      - .pre-commit-config.yaml
      - npm-shrinkwrap.json
      - package.json
      - package-lock.json
      - requirements-dev.txt
  pull_request:
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - .github/workflows/.npmrc
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/Invoke-LockedPythonHook.ps1
      - .github/workflows/lint-staged-markdown.mjs
      - .github/workflows/npm-shrinkwrap.json
      - .github/workflows/package.json
      - .github/workflows/package-lock.json
      - .npmrc
      - .pre-commit-config.yaml
      - npm-shrinkwrap.json
      - package.json
      - package-lock.json
      - requirements-dev.txt

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Install locked repository validation tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false
          clean: true
          fetch-depth: 0
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true
          allow-unsafe-pr-checkout: false

      - name: Establish published baseline reference
        shell: bash
        run: |
          set -euo pipefail
          git remote set-head origin --auto
          published_ref="$(git symbolic-ref --quiet refs/remotes/origin/HEAD)"
          case "${published_ref}" in
            refs/remotes/origin/*) ;;
            *) exit 1 ;;
          esac
          git rev-parse --verify "${published_ref}^{commit}"

      - name: Reject alternate npm install inputs
        shell: bash
        run: |
          set -euo pipefail
          declare -ar alternate_inputs=(
            .npmrc
            npm-shrinkwrap.json
            .github/workflows/.npmrc
            .github/workflows/npm-shrinkwrap.json
          )
          for alternate_input in "${alternate_inputs[@]}"; do
            if [[ -e "${alternate_input}" || -L "${alternate_input}" ]]; then
              echo "::error file=${alternate_input}::Unsupported npm" \
                'install input.'
              exit 1
            fi
          done

      - name: Verify locked validation-tool inputs
        shell: bash
        run: |
          set -euo pipefail
          root_manifest='package.json'
          root_lock='package-lock.json'
          workflow_manifest='.github/workflows/package.json'
          workflow_lock='.github/workflows/package-lock.json'
          pre_commit_config='.pre-commit-config.yaml'
          python_hook_launcher='.github/workflows/Invoke-LockedPythonHook.ps1'
          staged_markdown_helper='.github/workflows/lint-staged-markdown.mjs'

          for required_file in \
            "${root_manifest}" \
            "${root_lock}" \
            "${workflow_manifest}" \
            "${workflow_lock}" \
            "${pre_commit_config}" \
            "${python_hook_launcher}" \
            "${staged_markdown_helper}"; do
            if [[ ! -f "${required_file}" || -L "${required_file}" ]]; then
              echo "::error file=${required_file}::Required locked npm input" \
                'is missing or is not a regular file.'
              exit 1
            fi
          done

          declare -Ar reviewed_sha256=(
            ["${root_manifest}"]='ca77a11a7bd4ae55842ef0f1b8c4b9c0d32e3d6b8fa202455a12e354bf2d696b'
            ["${root_lock}"]='e07939c3791be364486aedc928da532870f6d9f29ec2a6a4733be2cc143f5009'
            ["${workflow_manifest}"]='c6db6befda88e58aa5568f52f44ca934af5751e545dba0644297b9fb15577e0d'
            ["${workflow_lock}"]='84cbe61e33e4c66b653efd2bfbe3f80b0061368a64ad80ef0de4898da28d887d'
            ["${pre_commit_config}"]='0e9da6a7c4bd0d89c83fd3041e67921e3bc08d159f4b6cd36b1b2e9f0b63a37b'
            ["${python_hook_launcher}"]='b4ef9791bef6c915d4c7b9057d07153579a91df988070c8bc24c192e46884720'
            ["${staged_markdown_helper}"]='6e8ac89afb17dd36f1edcf9b59ddfb066706fc6686be22e007c540ae20c810c2'
          )
          for reviewed_input in "${!reviewed_sha256[@]}"; do
            actual_sha256="$(sha256sum -- "${reviewed_input}" | cut -d ' ' -f 1)"
            test "${actual_sha256}" = "${reviewed_sha256[${reviewed_input}]}"
          done

      # See: https://github.com/actions/setup-python/releases/latest
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked Python validation tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f requirements-dev.txt || -L requirements-dev.txt ]]; then
            echo '::error file=requirements-dev.txt::The locked Python' \
              'requirements input is missing or is not a regular file.'
            exit 1
          fi
          test "$(python -c \
            'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" \
            = '3.12'
          reviewed_requirements_sha256='f9aaac5456d8c076becff82222a49a3a16ef1267de93d347ebcac0fe3a3f5652'
          test "$(sha256sum requirements-dev.txt | cut -d ' ' -f 1)" \
            = "${reviewed_requirements_sha256}"
          python -m pip install --requirement requirements-dev.txt
          test "$(python -m pre_commit --version)" = 'pre-commit 4.6.2'
          python -m pip check

      - name: Set up locked Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .github/workflows/package-lock.json

      - name: Verify selected Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          expected_node="$(node -p \
            'require("./package.json").engines.node')"
          expected_npm="$(node -p \
            'require("./package.json").engines.npm')"
          test "$(node --version)" = "v${expected_node}"
          test "$(npm --version)" = "${expected_npm}"

      - name: Install locked Node.js validation tools
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --fund=false --include=dev
          npm ci --ignore-scripts --no-audit --fund=false --include=dev \
            --prefix .github/workflows

      - name: Verify locked dependency trees and immutable manifests
        shell: bash
        run: |
          set -euo pipefail
          npm ls --all
          npm --prefix .github/workflows ls --all
          immutable_inputs=(
            package.json
            package-lock.json
            .github/workflows/package.json
            .github/workflows/package-lock.json
            .github/workflows/Invoke-LockedPythonHook.ps1
            .github/workflows/lint-staged-markdown.mjs
            requirements-dev.txt
          )
          git diff --exit-code -- "${immutable_inputs[@]}"

      - name: Activate retained pre-commit hook
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix .github/workflows run prepare
          test "$(git config --get core.hooksPath)" = '.husky/_'
          test -x .husky/_/pre-commit

      - name: Run complete repository validation hook set
        shell: bash
        run: |
          set -euo pipefail
          python -m pre_commit run --all-files
