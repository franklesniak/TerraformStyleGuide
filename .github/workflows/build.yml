name: Build Style Guide Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out triggering revision
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          show-progress: false
          lfs: false
          submodules: false
          clean: true
          set-safe-directory: true
          allow-unsafe-pr-checkout: false

      - name: Verify checkout credential cleanup
        id: verify-checkout-credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # git config exits 1 when a queried key is absent, which is the secure
          # expected state this step asserts. If the runner enables native-command
          # error mapping, that accepted status would terminate the step before the
          # explicit capture below runs, so it is disabled the same way
          # markdownlint.yml disables it.
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) {
              $PSNativeCommandUseErrorActionPreference = $false
          }
          $arrRemoteUrls = @(& git remote get-url --all origin)
          if ($LASTEXITCODE -ne 0 -or $arrRemoteUrls.Count -ne 1) {
              throw 'credential-policy: unable to resolve exactly one origin URL'
          }
          if ($arrRemoteUrls[0] -notmatch '^https://github\.com/[^/@]+/[^/@]+(?:\.git)?$') {
              throw 'credential-policy: origin is not a credential-free GitHub HTTPS URL'
          }
          $arrHelpers = @(& git config --local --get-all credential.helper)
          $intHelperExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (($intHelperExit -ne 0 -and $intHelperExit -ne 1) -or $arrHelpers.Count -ne 0) {
              throw 'credential-policy: a local credential helper is configured'
          }
          $arrAuthorizationKeys = @(& git config --local --name-only --get-regexp '^http\..*\.extraheader$')
          $intAuthorizationExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (($intAuthorizationExit -ne 0 -and $intAuthorizationExit -ne 1) -or $arrAuthorizationKeys.Count -ne 0) {
              throw 'credential-policy: persisted HTTP authorization is configured'
          }

      - name: Generate and verify committed artifacts
        id: generate-and-verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arrArtifacts = @(
              'STYLE_GUIDE_CHAT.md'
              'STYLE_GUIDE_FULL.md'
              'copilot-instructions.md'
              'terraform.instructions.md'
          )

          function Invoke-GitRaw {
              param([string[]]$Arguments)
              $objStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
              $arrGitCommands = @(Get-Command git -CommandType Application -ErrorAction Stop)
              if ($arrGitCommands.Count -eq 0) { throw 'native-tool: Git application was not resolved' }
              $objStartInfo.FileName = $arrGitCommands[0].Source
              $objStartInfo.UseShellExecute = $false
              $objStartInfo.RedirectStandardOutput = $true
              $objStartInfo.RedirectStandardError = $true
              foreach ($strArgument in $Arguments) {
                  [void]$objStartInfo.ArgumentList.Add($strArgument)
              }
              $objProcess = [System.Diagnostics.Process]::new()
              $objProcess.StartInfo = $objStartInfo
              $objOutput = [System.IO.MemoryStream]::new()
              try {
                  if (-not $objProcess.Start()) { throw 'native-tool: Git did not start' }
                  # Both redirected pipes must drain concurrently. Reading one to
                  # completion first deadlocks when the child fills the other.
                  $objCopyTask = $objProcess.StandardOutput.BaseStream.CopyToAsync($objOutput)
                  $objErrorTask = $objProcess.StandardError.ReadToEndAsync()
                  $objCopyTask.GetAwaiter().GetResult()
                  $strError = $objErrorTask.GetAwaiter().GetResult()
                  $objProcess.WaitForExit()
                  return [pscustomobject]@{ ExitCode = $objProcess.ExitCode; Bytes = $objOutput.ToArray(); Error = $strError }
              } finally {
                  $objOutput.Dispose()
                  $objProcess.Dispose()
              }
          }

          function ConvertFrom-NulRecords {
              param([byte[]]$Bytes)
              if ($Bytes.Length -eq 0) { return @() }
              if ($Bytes[$Bytes.Length - 1] -ne 0) { throw 'git-paths: missing final NUL' }
              $arrRecords = @()
              $intStart = 0
              for ($intIndex = 0; $intIndex -lt $Bytes.Length; $intIndex++) {
                  if ($Bytes[$intIndex] -eq 0) {
                      if ($intIndex -eq $intStart) { throw 'git-paths: empty or duplicate record' }
                      $arrRecord = [byte[]]::new($intIndex - $intStart)
                      [System.Array]::Copy($Bytes, $intStart, $arrRecord, 0, $arrRecord.Length)
                      $arrRecords += ,$arrRecord
                      $intStart = $intIndex + 1
                  }
              }
              return $arrRecords
          }

          function Assert-AllowedPaths {
              param([byte[][]]$Records, [string[]]$Allowed, [string]$Surface)
              $objUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
              $arrObserved = @()
              foreach ($arrRecord in $Records) {
                  try { $strPath = $objUtf8.GetString($arrRecord) } catch { throw "git-paths: undecodable $Surface record" }
                  $arrRoundTrip = $objUtf8.GetBytes($strPath)
                  if ([Convert]::ToBase64String($arrRecord) -cne [Convert]::ToBase64String($arrRoundTrip)) {
                      throw "git-paths: ambiguous $Surface record"
                  }
                  if ($arrObserved -ccontains $strPath) { throw "git-paths: duplicate $Surface record" }
                  if ($Allowed -cnotcontains $strPath) { throw "git-paths: unexpected $Surface path" }
                  $arrObserved += $strPath
              }
              return @($arrObserved | Sort-Object -CaseSensitive)
          }

          & ./.github/workflows/Generate-StyleGuideArtifacts.ps1
          if ($LASTEXITCODE -ne 0) { throw "generator: native exit $LASTEXITCODE" }

          $objWorking = Invoke-GitRaw @('diff', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '-z', '--')
          $objStaged = Invoke-GitRaw @('diff', '--cached', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '-z', '--')
          $objUntracked = Invoke-GitRaw @('ls-files', '--others', '--exclude-standard', '-z', '--')
          foreach ($objResult in @($objWorking, $objStaged, $objUntracked)) {
              if ($objResult.ExitCode -ne 0) { throw "native-tool: Git path query failed with exit $($objResult.ExitCode)" }
          }
          $arrWorking = Assert-AllowedPaths (ConvertFrom-NulRecords $objWorking.Bytes) $arrArtifacts 'working'
          $arrStaged = Assert-AllowedPaths (ConvertFrom-NulRecords $objStaged.Bytes) @() 'staged'
          $arrUntracked = Assert-AllowedPaths (ConvertFrom-NulRecords $objUntracked.Bytes) @() 'untracked'
          if ($arrStaged.Count -ne 0 -or $arrUntracked.Count -ne 0) { throw 'git-paths: checkout is not clean' }

          $objDiff = Invoke-GitRaw (@('diff', '--no-ext-diff', '--no-textconv', '--quiet', '--') + $arrArtifacts)
          if ($objDiff.ExitCode -ne 0 -and $objDiff.ExitCode -ne 1) {
              throw "native-tool: git diff failed with exit $($objDiff.ExitCode)"
          }
          Write-Host "generated-artifacts diff classification: $($objDiff.ExitCode)"

      - name: Upload verified generated artifacts
        id: upload-generated
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: style-guide-artifacts
          path: |
            copilot-instructions.md
            terraform.instructions.md
            STYLE_GUIDE_CHAT.md
            STYLE_GUIDE_FULL.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false

  # Temporary pre-promotion writer. T1B deletes this job and replaces it with
  # the reviewed candidate, approval, and exact-lease promotion topology.
  temporary-writer:
    needs: [verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out triggering revision
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          show-progress: false
          lfs: false
          submodules: false
          clean: true
          set-safe-directory: true
          allow-unsafe-pr-checkout: false

      - name: Verify checkout credential cleanup
        id: verify-checkout-credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # git config exits 1 when a queried key is absent, which is the secure
          # expected state this step asserts. If the runner enables native-command
          # error mapping, that accepted status would terminate the step before the
          # explicit capture below runs, so it is disabled the same way
          # markdownlint.yml disables it.
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) {
              $PSNativeCommandUseErrorActionPreference = $false
          }
          $arrRemoteUrls = @(& git remote get-url --all origin)
          if ($LASTEXITCODE -ne 0 -or $arrRemoteUrls.Count -ne 1) {
              throw 'credential-policy: unable to resolve exactly one origin URL'
          }
          if ($arrRemoteUrls[0] -notmatch '^https://github\.com/[^/@]+/[^/@]+(?:\.git)?$') {
              throw 'credential-policy: origin is not a credential-free GitHub HTTPS URL'
          }
          $arrHelpers = @(& git config --local --get-all credential.helper)
          $intHelperExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (($intHelperExit -ne 0 -and $intHelperExit -ne 1) -or $arrHelpers.Count -ne 0) {
              throw 'credential-policy: a local credential helper is configured'
          }
          $arrAuthorizationKeys = @(& git config --local --name-only --get-regexp '^http\..*\.extraheader$')
          $intAuthorizationExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (($intAuthorizationExit -ne 0 -and $intAuthorizationExit -ne 1) -or $arrAuthorizationKeys.Count -ne 0) {
              throw 'credential-policy: persisted HTTP authorization is configured'
          }

      - name: Regenerate and prepare the bounded artifact commit
        id: prepare-generated-commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arrArtifacts = @(
              'STYLE_GUIDE_CHAT.md'
              'STYLE_GUIDE_FULL.md'
              'copilot-instructions.md'
              'terraform.instructions.md'
          )

          function Invoke-GitRaw {
              param([string[]]$Arguments)
              $objStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
              $arrGitCommands = @(Get-Command git -CommandType Application -ErrorAction Stop)
              if ($arrGitCommands.Count -eq 0) { throw 'native-tool: Git application was not resolved' }
              $objStartInfo.FileName = $arrGitCommands[0].Source
              $objStartInfo.UseShellExecute = $false
              $objStartInfo.RedirectStandardOutput = $true
              $objStartInfo.RedirectStandardError = $true
              foreach ($strArgument in $Arguments) { [void]$objStartInfo.ArgumentList.Add($strArgument) }
              $objProcess = [System.Diagnostics.Process]::new()
              $objProcess.StartInfo = $objStartInfo
              $objOutput = [System.IO.MemoryStream]::new()
              try {
                  if (-not $objProcess.Start()) { throw 'native-tool: Git did not start' }
                  # Both redirected pipes must drain concurrently. Reading one to
                  # completion first deadlocks when the child fills the other.
                  $objCopyTask = $objProcess.StandardOutput.BaseStream.CopyToAsync($objOutput)
                  $objErrorTask = $objProcess.StandardError.ReadToEndAsync()
                  $objCopyTask.GetAwaiter().GetResult()
                  $strError = $objErrorTask.GetAwaiter().GetResult()
                  $objProcess.WaitForExit()
                  return [pscustomobject]@{ ExitCode = $objProcess.ExitCode; Bytes = $objOutput.ToArray(); Error = $strError }
              } finally {
                  $objOutput.Dispose()
                  $objProcess.Dispose()
              }
          }

          function ConvertFrom-NulRecords {
              param([byte[]]$Bytes)
              if ($Bytes.Length -eq 0) { return @() }
              if ($Bytes[$Bytes.Length - 1] -ne 0) { throw 'git-paths: missing final NUL' }
              $arrRecords = @()
              $intStart = 0
              for ($intIndex = 0; $intIndex -lt $Bytes.Length; $intIndex++) {
                  if ($Bytes[$intIndex] -eq 0) {
                      if ($intIndex -eq $intStart) { throw 'git-paths: empty or duplicate record' }
                      $arrRecord = [byte[]]::new($intIndex - $intStart)
                      [System.Array]::Copy($Bytes, $intStart, $arrRecord, 0, $arrRecord.Length)
                      $arrRecords += ,$arrRecord
                      $intStart = $intIndex + 1
                  }
              }
              return $arrRecords
          }

          function Assert-AllowedPaths {
              param([byte[][]]$Records, [string[]]$Allowed, [string]$Surface)
              $objUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
              $arrObserved = @()
              foreach ($arrRecord in $Records) {
                  try { $strPath = $objUtf8.GetString($arrRecord) } catch { throw "git-paths: undecodable $Surface record" }
                  $arrRoundTrip = $objUtf8.GetBytes($strPath)
                  if ([Convert]::ToBase64String($arrRecord) -cne [Convert]::ToBase64String($arrRoundTrip)) {
                      throw "git-paths: ambiguous $Surface record"
                  }
                  if ($arrObserved -ccontains $strPath) { throw "git-paths: duplicate $Surface record" }
                  if ($Allowed -cnotcontains $strPath) { throw "git-paths: unexpected $Surface path" }
                  $arrObserved += $strPath
              }
              return @($arrObserved | Sort-Object -CaseSensitive)
          }

          $objHeadBefore = Invoke-GitRaw @('rev-parse', 'HEAD')
          if ($objHeadBefore.ExitCode -ne 0) { throw "native-tool: HEAD query failed with exit $($objHeadBefore.ExitCode)" }

          & ./.github/workflows/Generate-StyleGuideArtifacts.ps1
          if ($LASTEXITCODE -ne 0) { throw "generator: native exit $LASTEXITCODE" }

          # A clean working tree does not mean nothing happened. The generator can
          # build a commit whose parent is the triggering SHA and reset onto it,
          # leaving the working, index, and untracked sets all empty -- and the
          # push step accepts any commit with that exact parent. Whether HEAD
          # moved is therefore asserted rather than inferred from cleanliness.
          $objHeadAfter = Invoke-GitRaw @('rev-parse', 'HEAD')
          if ($objHeadAfter.ExitCode -ne 0) { throw "native-tool: HEAD query failed with exit $($objHeadAfter.ExitCode)" }
          if ([Convert]::ToBase64String($objHeadAfter.Bytes) -cne [Convert]::ToBase64String($objHeadBefore.Bytes)) {
              throw 'git-state: the generator moved HEAD'
          }

          # Everything a step writes to these two files is applied by the runner to
          # every later step, including the one that receives the push token. .NET
          # reads variables such as DOTNET_STARTUP_HOOKS during process start-up,
          # before that step's first line can run, so no in-step handling of the
          # token can undo a write here. Emptiness is asserted, not the absence of
          # any particular variable.
          foreach ($strChannel in @($env:GITHUB_ENV, $env:GITHUB_PATH)) {
              if ([string]::IsNullOrEmpty($strChannel)) { throw 'runner-state: a step communication file path is unset' }
              if ((Get-Item -LiteralPath $strChannel -Force).Length -ne 0) {
                  throw 'runner-state: the generator wrote to a runner step communication file'
              }
          }

          $objWorking = Invoke-GitRaw @('diff', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '-z', '--')
          $objStaged = Invoke-GitRaw @('diff', '--cached', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '-z', '--')
          $objUntracked = Invoke-GitRaw @('ls-files', '--others', '--exclude-standard', '-z', '--')
          foreach ($objResult in @($objWorking, $objStaged, $objUntracked)) {
              if ($objResult.ExitCode -ne 0) { throw "native-tool: Git path query failed with exit $($objResult.ExitCode)" }
          }
          $arrWorking = Assert-AllowedPaths (ConvertFrom-NulRecords $objWorking.Bytes) $arrArtifacts 'working'
          $arrStaged = Assert-AllowedPaths (ConvertFrom-NulRecords $objStaged.Bytes) @() 'staged'
          $arrUntracked = Assert-AllowedPaths (ConvertFrom-NulRecords $objUntracked.Bytes) @() 'untracked'
          if ($arrStaged.Count -ne 0 -or $arrUntracked.Count -ne 0) { throw 'git-paths: checkout is not clean' }
          if ($arrWorking.Count -eq 0) { return }

          & git add -- @arrArtifacts
          if ($LASTEXITCODE -ne 0) { throw "native-tool: git add failed with exit $LASTEXITCODE" }
          $objCached = Invoke-GitRaw @('diff', '--cached', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '-z', '--')
          if ($objCached.ExitCode -ne 0) { throw "native-tool: cached path query failed with exit $($objCached.ExitCode)" }
          $arrCached = Assert-AllowedPaths (ConvertFrom-NulRecords $objCached.Bytes) $arrArtifacts 'staged'
          if ($arrCached.Count -ne $arrWorking.Count) { throw 'git-paths: staged and working path sets differ' }
          for ($intIndex = 0; $intIndex -lt $arrCached.Count; $intIndex++) {
              if ($arrCached[$intIndex] -cne $arrWorking[$intIndex]) { throw 'git-paths: staged and working path sets differ' }
          }

          & git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw "native-tool: git config email failed with exit $LASTEXITCODE" }
          & git config --local user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { throw "native-tool: git config name failed with exit $LASTEXITCODE" }
          # Hooks are under .git, so they are invisible to every working-tree check
          # above, and a pre-commit hook runs after the staged set has been proven
          # bounded — it can stage any additional path into the very commit that is
          # then pushed. The push already declines to run hooks; the commit must
          # decline for the same reason.
          & git commit --no-verify -m 'chore: update generated style guide artifacts [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw "native-tool: git commit failed with exit $LASTEXITCODE" }

          # Bounding the index proves what was offered to the commit, not what the
          # commit contains. This asserts the property that actually travels: the
          # paths recorded in the object that is about to be pushed.
          $objCommitted = Invoke-GitRaw @('diff-tree', '--no-commit-id', '--no-renames', '--name-only', '-r', '-z', 'HEAD', '--')
          if ($objCommitted.ExitCode -ne 0) { throw "native-tool: committed path query failed with exit $($objCommitted.ExitCode)" }
          $arrCommitted = Assert-AllowedPaths (ConvertFrom-NulRecords $objCommitted.Bytes) $arrArtifacts 'committed'
          if ($arrCommitted.Count -ne $arrWorking.Count) { throw 'git-paths: committed and working path sets differ' }
          for ($intIndex = 0; $intIndex -lt $arrCommitted.Count; $intIndex++) {
              if ($arrCommitted[$intIndex] -cne $arrWorking[$intIndex]) { throw 'git-paths: committed and working path sets differ' }
          }

      - name: Push the temporary pre-promotion commit
        id: push-generated
        shell: pwsh
        env:
          STYLE_GUIDE_PUSH_TOKEN: ${{ github.token }}
          STYLE_GUIDE_TRIGGER_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $strToken = $env:STYLE_GUIDE_PUSH_TOKEN
          Remove-Item Env:STYLE_GUIDE_PUSH_TOKEN -ErrorAction SilentlyContinue
          $strTriggerSha = $env:STYLE_GUIDE_TRIGGER_SHA

          # Which executable runs is decided by PATH, not by the argument list or
          # by this script's text. Any earlier step in this job — including the
          # repository-controlled generator — can append a directory to the file
          # named by $GITHUB_PATH, and the runner prepends that directory to PATH
          # for every later step. A PATH lookup here would therefore let a wrapper
          # in a writable directory be started with the authorization header below
          # in its environment, defeating the argument, ref, and digest checks that
          # constrain this step. Resolution is pinned to root-owned system paths.
          $strGitPath = $null
          foreach ($strCandidate in @('/usr/bin/git', '/bin/git')) {
              if (Test-Path -LiteralPath $strCandidate -PathType Leaf) {
                  $strGitPath = $strCandidate
                  break
              }
          }
          if ($null -eq $strGitPath) { throw 'native-tool: trusted Git executable was not found' }

          $strHead = (& $strGitPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "native-tool: git rev-parse HEAD failed with exit $LASTEXITCODE" }
          if ($strHead -ceq $strTriggerSha) {
              $strToken = $null
              return
          }
          $strParent = (& $strGitPath rev-parse 'HEAD^').Trim()
          if ($LASTEXITCODE -ne 0 -or $strParent -cne $strTriggerSha) {
              throw 'push-policy: prepared commit does not have the triggering SHA as its exact parent'
          }
          $arrRemoteUrls = @(& $strGitPath remote get-url --all origin)
          if ($LASTEXITCODE -ne 0 -or $arrRemoteUrls.Count -ne 1 -or
              $arrRemoteUrls[0] -notmatch '^https://github\.com/[^/@]+/[^/@]+(?:\.git)?$') {
              throw 'push-policy: origin is not one credential-free GitHub HTTPS URL'
          }
          # get-url reports fetch URLs. A push uses remote.origin.pushurl when one
          # is set, and local .git/config can set it -- neither GIT_CONFIG_GLOBAL
          # nor GIT_CONFIG_SYSTEM suppresses repository-local configuration. The
          # URL the push will actually contact is therefore checked on its own.
          $arrPushUrls = @(& $strGitPath remote get-url --push --all origin)
          if ($LASTEXITCODE -ne 0 -or $arrPushUrls.Count -ne 1 -or
              $arrPushUrls[0] -notmatch '^https://github\.com/[^/@]+/[^/@]+(?:\.git)?$') {
              throw 'push-policy: origin push URL is not one credential-free GitHub HTTPS URL'
          }

          # Repository-local configuration is the one configuration file the
          # generator can still author, and no GIT_CONFIG_GLOBAL or
          # GIT_CONFIG_SYSTEM value suppresses it. Overriding it key by key cannot
          # work: a URL-specific setting such as http.https://github.com/.proxy
          # outranks a generic http.proxy no matter which file each came from, and
          # the URL prefix can always be made longer than any prefix written here.
          # So this stops reading a file the generator can write, and writes the
          # configuration the push runs against from the URL validated above. No
          # fetch refspec is included because nothing here fetches.
          $strGitDirectory = (& $strGitPath rev-parse --git-dir).Trim()
          if ($LASTEXITCODE -ne 0) { throw "native-tool: git directory query failed with exit $LASTEXITCODE" }
          $strReviewedConfig = "[core]`n`trepositoryformatversion = 0`n`tfilemode = true`n`tbare = false`n`tlogallrefupdates = true`n[remote `"origin`"]`n`turl = $($arrRemoteUrls[0])`n"
          [System.IO.File]::WriteAllText(
              [System.IO.Path]::Combine($strGitDirectory, 'config'),
              $strReviewedConfig,
              [System.Text.UTF8Encoding]::new($false))

          $arrCredentialBytes = $null
          $strAuthorization = $null
          $objProcess = $null
          try {
              $arrCredentialBytes = [System.Text.Encoding]::UTF8.GetBytes("x-access-token:$strToken")
              $strAuthorization = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String($arrCredentialBytes)
              $strToken = $null

              $objStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
              $objStartInfo.FileName = $strGitPath
              $objStartInfo.UseShellExecute = $false
              $objStartInfo.RedirectStandardOutput = $true
              $objStartInfo.RedirectStandardError = $true
              [void]$objStartInfo.ArgumentList.Add('push')
              # Hooks live under .git and are invisible to the bounded working-tree
              # checks, so a pre-push hook or core.hooksPath change would execute
              # with the authorization header in this process environment.
              [void]$objStartInfo.ArgumentList.Add('--no-verify')
              # push.followTags expands one approved invocation into a tag write
              # that no refspec in this list names. Refused as an argument, so the
              # guarantee does not rest on configuration precedence.
              [void]$objStartInfo.ArgumentList.Add('--no-follow-tags')
              [void]$objStartInfo.ArgumentList.Add("--force-with-lease=refs/heads/main:$strTriggerSha")
              [void]$objStartInfo.ArgumentList.Add('origin')
              [void]$objStartInfo.ArgumentList.Add('HEAD:refs/heads/main')
              # The inherited environment steers this process as effectively as the
              # executable path does. A single variable written by an earlier step
              # through $GITHUB_ENV — a proxy setting, a loader preload, a Git
              # configuration override, an askpass or SSH command — is enough to
              # redirect or observe an authenticated push. Enumerating the unsafe
              # names cannot be complete, so the child environment is built from
              # empty and contains only what this push requires.
              $objStartInfo.Environment.Clear()
              $objStartInfo.Environment['PATH'] = '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
              $objStartInfo.Environment['GIT_CONFIG_GLOBAL'] = '/dev/null'
              $objStartInfo.Environment['GIT_CONFIG_SYSTEM'] = '/dev/null'
              $objStartInfo.Environment['GIT_TERMINAL_PROMPT'] = '0'
              # Configuration injected through GIT_CONFIG_COUNT outranks every
              # configuration file, including repository-local .git/config, which
              # is the one file the generator can still write and which no
              # GIT_CONFIG_GLOBAL or GIT_CONFIG_SYSTEM setting suppresses. A
              # transport allowlist is applied here rather than a list of bad
              # settings: ext:: and the other command-executing transports run a
              # program that would inherit the authorization header below, and a
              # URL validated a moment ago can still be rewritten into one of them
              # by url.<base>.insteadOf. Restricting the transport makes the
              # rewrite harmless, since https is the only reachable one and the
              # header is scoped to https://github.com/. The empty credential
              # helper resets any helper the same file could have configured,
              # which would otherwise be another program git executes.
              $objStartInfo.Environment['GIT_CONFIG_COUNT'] = '5'
              $objStartInfo.Environment['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
              $objStartInfo.Environment['GIT_CONFIG_VALUE_0'] = $strAuthorization
              $objStartInfo.Environment['GIT_CONFIG_KEY_1'] = 'protocol.allow'
              $objStartInfo.Environment['GIT_CONFIG_VALUE_1'] = 'never'
              $objStartInfo.Environment['GIT_CONFIG_KEY_2'] = 'protocol.https.allow'
              $objStartInfo.Environment['GIT_CONFIG_VALUE_2'] = 'always'
              $objStartInfo.Environment['GIT_CONFIG_KEY_3'] = 'protocol.ext.allow'
              $objStartInfo.Environment['GIT_CONFIG_VALUE_3'] = 'never'
              $objStartInfo.Environment['GIT_CONFIG_KEY_4'] = 'credential.helper'
              $objStartInfo.Environment['GIT_CONFIG_VALUE_4'] = ''
              $objProcess = [System.Diagnostics.Process]::new()
              $objProcess.StartInfo = $objStartInfo
              if (-not $objProcess.Start()) { throw 'native-tool: git push did not start' }
              # Both redirected pipes must drain concurrently. Reading one to
              # completion first deadlocks when the child fills the other, which
              # in this job would hang a contents-write step until the Actions
              # timeout rather than failing.
              $objOutputTask = $objProcess.StandardOutput.ReadToEndAsync()
              $objErrorTask = $objProcess.StandardError.ReadToEndAsync()
              $strStandardOutput = $objOutputTask.GetAwaiter().GetResult()
              $strStandardError = $objErrorTask.GetAwaiter().GetResult()
              $objProcess.WaitForExit()
              $intPushExit = $objProcess.ExitCode
          } finally {
              $strToken = $null
              $strAuthorization = $null
              if ($null -ne $arrCredentialBytes) { [System.Array]::Clear($arrCredentialBytes, 0, $arrCredentialBytes.Length) }
              Remove-Item Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0, Env:GIT_CONFIG_KEY_1, Env:GIT_CONFIG_VALUE_1, Env:GIT_CONFIG_KEY_2, Env:GIT_CONFIG_VALUE_2, Env:GIT_CONFIG_KEY_3, Env:GIT_CONFIG_VALUE_3, Env:GIT_CONFIG_KEY_4, Env:GIT_CONFIG_VALUE_4 -ErrorAction SilentlyContinue
              if ($null -ne $objProcess) { $objProcess.Dispose() }
          }
          if ($intPushExit -ne 0) { throw "native-tool: git push failed with exit $intPushExit" }
          $strVerifiedHead = (& $strGitPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $strVerifiedHead -cne $strHead) {
              throw 'push-policy: local post-push ref verification failed'
          }
