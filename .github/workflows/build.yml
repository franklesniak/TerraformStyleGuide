name: Build Style Guide Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out triggering revision
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          show-progress: false
          lfs: false
          submodules: false
          clean: true
          set-safe-directory: true
          allow-unsafe-pr-checkout: false

      - name: Verify checkout credential cleanup
        id: verify-checkout-credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # git config exits 1 when a queried key is absent, which is the secure
          # expected state this step asserts. If the runner enables native-command
          # error mapping, that accepted status would terminate the step before the
          # explicit capture below runs, so it is disabled the same way
          # markdownlint.yml disables it.
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) {
              $PSNativeCommandUseErrorActionPreference = $false
          }
          $arrRemoteUrls = @(& git remote get-url --all origin)
          if ($LASTEXITCODE -ne 0 -or $arrRemoteUrls.Count -ne 1) {
              throw 'credential-policy: unable to resolve exactly one origin URL'
          }
          if ($arrRemoteUrls[0] -notmatch '^https://github\.com/[^/@]+/[^/@]+(?:\.git)?$') {
              throw 'credential-policy: origin is not a credential-free GitHub HTTPS URL'
          }
          $arrHelpers = @(& git config --local --get-all credential.helper)
          $intHelperExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (($intHelperExit -ne 0 -and $intHelperExit -ne 1) -or $arrHelpers.Count -ne 0) {
              throw 'credential-policy: a local credential helper is configured'
          }
          $arrAuthorizationKeys = @(& git config --local --name-only --get-regexp '^http\..*\.extraheader$')
          $intAuthorizationExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (($intAuthorizationExit -ne 0 -and $intAuthorizationExit -ne 1) -or $arrAuthorizationKeys.Count -ne 0) {
              throw 'credential-policy: persisted HTTP authorization is configured'
          }

      - name: Generate and verify committed artifacts
        id: generate-and-verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arrArtifacts = @(
              'STYLE_GUIDE_CHAT.md'
              'STYLE_GUIDE_FULL.md'
              'copilot-instructions.md'
              'terraform.instructions.md'
          )

          function Invoke-GitRaw {
              param([string[]]$Arguments)
              $objStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
              # Resolved once before the generator ran, and held in a constant.
              # Resolving here instead would consult PATH and the command table
              # after repository code has executed, and both are things that
              # code can steer. See the resolution below.
              $objStartInfo.FileName = $strGitPath
              $objStartInfo.UseShellExecute = $false
              $objStartInfo.RedirectStandardOutput = $true
              $objStartInfo.RedirectStandardError = $true
              foreach ($strArgument in $Arguments) {
                  [void]$objStartInfo.ArgumentList.Add($strArgument)
              }
              $objProcess = [System.Diagnostics.Process]::new()
              $objProcess.StartInfo = $objStartInfo
              $objOutput = [System.IO.MemoryStream]::new()
              try {
                  if (-not $objProcess.Start()) { throw 'native-tool: Git did not start' }
                  # Both redirected pipes must drain concurrently. Reading one to
                  # completion first deadlocks when the child fills the other.
                  $objCopyTask = $objProcess.StandardOutput.BaseStream.CopyToAsync($objOutput)
                  $objErrorTask = $objProcess.StandardError.ReadToEndAsync()
                  $objCopyTask.GetAwaiter().GetResult()
                  $strError = $objErrorTask.GetAwaiter().GetResult()
                  $objProcess.WaitForExit()
                  return [pscustomobject]@{ ExitCode = $objProcess.ExitCode; Bytes = $objOutput.ToArray(); Error = $strError }
              } finally {
                  $objOutput.Dispose()
                  $objProcess.Dispose()
              }
          }

          function ConvertFrom-NulRecords {
              param([byte[]]$Bytes)
              if ($Bytes.Length -eq 0) { return @() }
              if ($Bytes[$Bytes.Length - 1] -ne 0) { throw 'git-paths: missing final NUL' }
              $arrRecords = @()
              $intStart = 0
              for ($intIndex = 0; $intIndex -lt $Bytes.Length; $intIndex++) {
                  if ($Bytes[$intIndex] -eq 0) {
                      if ($intIndex -eq $intStart) { throw 'git-paths: empty or duplicate record' }
                      $arrRecord = [byte[]]::new($intIndex - $intStart)
                      [System.Array]::Copy($Bytes, $intStart, $arrRecord, 0, $arrRecord.Length)
                      $arrRecords += ,$arrRecord
                      $intStart = $intIndex + 1
                  }
              }
              return $arrRecords
          }

          function Assert-AllowedPaths {
              param([byte[][]]$Records, [string[]]$Allowed, [string]$Surface)
              $objUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
              $arrObserved = @()
              foreach ($arrRecord in $Records) {
                  try { $strPath = $objUtf8.GetString($arrRecord) } catch { throw "git-paths: undecodable $Surface record" }
                  $arrRoundTrip = $objUtf8.GetBytes($strPath)
                  if ([Convert]::ToBase64String($arrRecord) -cne [Convert]::ToBase64String($arrRoundTrip)) {
                      throw "git-paths: ambiguous $Surface record"
                  }
                  if ($arrObserved -ccontains $strPath) { throw "git-paths: duplicate $Surface record" }
                  if ($Allowed -cnotcontains $strPath) { throw "git-paths: unexpected $Surface path" }
                  $arrObserved += $strPath
              }
              return @($arrObserved | Sort-Object -CaseSensitive)
          }

          # Everything below this line runs after repository-controlled code, so
          # the tool it uses is fixed before that code runs. A fixed candidate
          # list rather than a PATH lookup, because PATH is writable by anything
          # that executes first; Constant rather than an ordinary variable,
          # because a script invoked with the call operator runs in a child
          # scope whose parent is this block and can therefore reassign an
          # ordinary variable here through Set-Variable -Scope 1.
          $strResolvedGit = @('/usr/bin/git', '/bin/git') | Where-Object { [System.IO.File]::Exists($_) } | Select-Object -First 1
          if ([string]::IsNullOrEmpty($strResolvedGit)) { throw 'native-tool: Git application was not resolved' }
          New-Variable -Name strGitPath -Value $strResolvedGit -Option Constant

          # Pinning the executable does not pin what it will do. Git loads
          # repository-local configuration on every invocation regardless of
          # which binary runs, and core.fsmonitor names a program Git executes
          # to decide which paths changed -- a hostile value makes the probes
          # below report a clean tree over modified files. Hooks are the same
          # shape of problem. Rather than enumerate the dangerous keys, the
          # repository's own control surface is digested and required to be
          # unchanged: the generator has no legitimate reason to touch .git.
          function Get-GitControlSurfaceDigest {
              $strGitDirectory = [System.IO.Path]::Combine($PWD.Path, '.git')
              if (-not [System.IO.Directory]::Exists($strGitDirectory)) { throw 'git-state: .git is not a directory' }
              $objSha = [System.Security.Cryptography.SHA256]::Create()
              try {
                  $objBuffer = [System.IO.MemoryStream]::new()
                  $strConfigPath = [System.IO.Path]::Combine($strGitDirectory, 'config')
                  if ([System.IO.File]::Exists($strConfigPath)) {
                      $arrConfig = [System.IO.File]::ReadAllBytes($strConfigPath)
                      $objBuffer.Write($arrConfig, 0, $arrConfig.Length)
                  }
                  $strHooksDirectory = [System.IO.Path]::Combine($strGitDirectory, 'hooks')
                  if ([System.IO.Directory]::Exists($strHooksDirectory)) {
                      foreach ($strHook in ([System.IO.Directory]::GetFiles($strHooksDirectory) | Sort-Object -CaseSensitive)) {
                          $arrName = [System.Text.Encoding]::UTF8.GetBytes([System.IO.Path]::GetFileName($strHook))
                          $objBuffer.Write($arrName, 0, $arrName.Length)
                          $arrHook = [System.IO.File]::ReadAllBytes($strHook)
                          $objBuffer.Write($arrHook, 0, $arrHook.Length)
                      }
                  }
                  return [Convert]::ToBase64String($objSha.ComputeHash($objBuffer.ToArray()))
              } finally { $objSha.Dispose() }
          }
          $strControlSurfaceBefore = Get-GitControlSurfaceDigest

          # The generator runs in its own process, not in this session. In-session
          # it could shadow a cmdlet with a function, reassign a variable in this
          # scope, or prepend a directory to PATH, and every check below would
          # then be reading what it chose. A process boundary removes the class
          # rather than naming its members: a child process cannot reach this
          # session's functions, variables, or environment.
          & pwsh -NoProfile -NonInteractive -File ./.github/workflows/Generate-StyleGuideArtifacts.ps1
          if ($LASTEXITCODE -ne 0) { throw "generator: native exit $LASTEXITCODE" }

          if ((Get-GitControlSurfaceDigest) -cne $strControlSurfaceBefore) {
              throw 'git-state: the generator changed repository Git configuration or hooks'
          }

          $objWorking = Invoke-GitRaw @('diff', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '-z', '--')
          $objStaged = Invoke-GitRaw @('diff', '--cached', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '-z', '--')
          $objUntracked = Invoke-GitRaw @('ls-files', '--others', '--exclude-standard', '-z', '--')
          foreach ($objResult in @($objWorking, $objStaged, $objUntracked)) {
              if ($objResult.ExitCode -ne 0) { throw "native-tool: Git path query failed with exit $($objResult.ExitCode)" }
          }
          $arrWorking = Assert-AllowedPaths (ConvertFrom-NulRecords $objWorking.Bytes) $arrArtifacts 'working'
          $arrStaged = Assert-AllowedPaths (ConvertFrom-NulRecords $objStaged.Bytes) @() 'staged'
          $arrUntracked = Assert-AllowedPaths (ConvertFrom-NulRecords $objUntracked.Bytes) @() 'untracked'
          if ($arrStaged.Count -ne 0 -or $arrUntracked.Count -ne 0) { throw 'git-paths: checkout is not clean' }

          $objDiff = Invoke-GitRaw (@('diff', '--no-ext-diff', '--no-textconv', '--quiet', '--') + $arrArtifacts)
          if ($objDiff.ExitCode -ne 0 -and $objDiff.ExitCode -ne 1) {
              throw "native-tool: git diff failed with exit $($objDiff.ExitCode)"
          }
          # Status 1 means the committed artifacts differ from what the generator
          # produces. While a promotion writer existed, recording that and
          # continuing was coherent: the writer committed the regenerated bytes,
          # and failing here would have skipped it, blocking the very promotion
          # that resolved the drift. Nothing commits them now. Tolerating status 1
          # would leave the repository permanently stale behind a green check,
          # which is worse than having no check at all -- it reports that the
          # committed artifacts were verified when they were only inspected.
          if ($objDiff.ExitCode -eq 1) {
              throw 'generated-artifacts: committed artifacts do not match generator output. Run ./.github/workflows/Generate-StyleGuideArtifacts.ps1 and commit the four regenerated files.'
          }
          Write-Host 'generated-artifacts: committed bytes match generator output'

      - name: Upload verified generated artifacts
        id: upload-generated
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: style-guide-artifacts
          path: |
            copilot-instructions.md
            terraform.instructions.md
            STYLE_GUIDE_CHAT.md
            STYLE_GUIDE_FULL.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false
