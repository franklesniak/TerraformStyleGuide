name: Agent instruction validation

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions: {}

jobs:
  validate-agent-instructions:
    if: >-
      github.event_name != 'push' ||
      !github.event.deleted
    name: Validate agent instructions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Acquire triggering revision without an action
        id: acquire
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Do not load user/system Git credentials or hooks during anonymous acquisition.
          if (-not [string]::IsNullOrEmpty($env:GIT_CONFIG_COUNT) -or
              -not [string]::IsNullOrEmpty($env:GIT_CONFIG_PARAMETERS)) {
              throw 'credential-policy: external Git command configuration is not allowed'
          }
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = '/dev/null'
          $env:GIT_TERMINAL_PROMPT = '0'
          if (-not [string]::IsNullOrEmpty($env:GITHUB_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:GH_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:ACTIONS_RUNTIME_TOKEN)) {
              throw 'credential-policy: a token was projected into a code job'
          }
          # git reports absent state with a non-zero status in places this step
          # accepts, so native-command error mapping is disabled the same way
          # the other governed steps disable it and each status is classified
          # explicitly instead.
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) {
              $PSNativeCommandUseErrorActionPreference = $false
          }

          # Every value below is set by the runner before any repository code
          # executes, and is read from the environment rather than expanded as
          # a workflow expression, because no governed script step in this
          # repository contains an expression at all.
          $strServerUrl = $env:GITHUB_SERVER_URL
          $strRepository = $env:GITHUB_REPOSITORY
          $strSha = $env:GITHUB_SHA
          if ($strServerUrl -cne 'https://github.com') {
              throw 'acquire: the runner named an unexpected server'
          }
          if ($strRepository -cne 'franklesniak/TerraformStyleGuide') {
              throw 'acquire: the triggering repository is not the expected repository'
          }
          # A full 40-hex commit is required rather than a ref. A ref would let
          # the fetch resolve to whatever the ref points at when the fetch runs,
          # which for a push to a busy branch is not necessarily the revision
          # that triggered this run.
          if ($strSha -cnotmatch '^[0-9a-f]{40}$') {
              throw 'acquire: the triggering revision is not a full commit hash'
          }

          # The workspace is proven empty rather than cleaned. Cleaning would
          # decide what to delete from state that is already present, while an
          # emptiness assertion has no such input.
          if (@([System.IO.Directory]::EnumerateFileSystemEntries($PWD.Path)).Count -ne 0) {
              throw 'acquire: the workspace is not empty'
          }

          # Resolved from a fixed candidate list rather than by name. Nothing has
          # executed in this step yet, so name resolution is not attacker-
          # influenced here -- but PowerShell aliases curl and wget to
          # Invoke-WebRequest on the Desktop edition, this repository already
          # pins the Git executable this way in the verify step, and relying on
          # an alias being absent is a property of the host rather than
          # something this file asserts. Constant, so nothing later can rebind
          # it.
          $strResolvedGit = @('/usr/bin/git', '/bin/git') | Where-Object { [System.IO.File]::Exists($_) } | Select-Object -First 1
          if ([string]::IsNullOrEmpty($strResolvedGit)) { throw 'acquire: Git was not resolved as an application' }
          New-Variable -Name strGitPath -Value $strResolvedGit -Option Constant

          & $strGitPath -c core.hooksPath=/dev/null init --quiet .
          if ($LASTEXITCODE -ne 0) { throw "acquire: git init exited $LASTEXITCODE" }
          & $strGitPath remote add origin "$strServerUrl/$strRepository"
          if ($LASTEXITCODE -ne 0) { throw "acquire: git remote add exited $LASTEXITCODE" }
          # Fetching the commit itself, not a ref that names it. No credential
          # is supplied and none is configured, so nothing is persisted for the
          # next step to have to clean up.
          & $strGitPath -c credential.helper= -c http.extraheader= -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules origin $strSha
          if ($LASTEXITCODE -ne 0) { throw "acquire: git fetch exited $LASTEXITCODE" }
          & $strGitPath -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "acquire: git checkout exited $LASTEXITCODE" }
          $strHead = (& $strGitPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $strHead -cne $strSha) {
              throw 'acquire: the checked out revision is not the triggering revision'
          }
          Write-Information "acquire: anonymous exact checkout of $strSha" -InformationAction Continue
      - name: Verify checkout credential cleanup
        id: verify-checkout-credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Do not load user/system Git credentials or hooks during anonymous acquisition.
          if (-not [string]::IsNullOrEmpty($env:GIT_CONFIG_COUNT) -or
              -not [string]::IsNullOrEmpty($env:GIT_CONFIG_PARAMETERS)) {
              throw 'credential-policy: external Git command configuration is not allowed'
          }
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = '/dev/null'
          $env:GIT_TERMINAL_PROMPT = '0'
          if (-not [string]::IsNullOrEmpty($env:GITHUB_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:GH_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:ACTIONS_RUNTIME_TOKEN)) {
              throw 'credential-policy: a token was projected into a code job'
          }
          # git config exits 1 when a queried key is absent, which is the secure
          # expected state this step asserts. If the runner enables native-command
          # error mapping, that accepted status would terminate the step before the
          # explicit capture below runs, so it is disabled the same way
          # markdownlint.yml disables it.
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) {
              $PSNativeCommandUseErrorActionPreference = $false
          }
          # Resolved here too. Constants do not cross step boundaries, and this
          # step asserts a credential property, so the executable it asks must
          # not be chosen by name resolution either.
          $strResolvedGit = @('/usr/bin/git', '/bin/git') | Where-Object { [System.IO.File]::Exists($_) } | Select-Object -First 1
          if ([string]::IsNullOrEmpty($strResolvedGit)) { throw 'credential-policy: Git was not resolved as an application' }
          New-Variable -Name strGitPath -Value $strResolvedGit -Option Constant
          $arrRemoteUrls = @(& $strGitPath remote get-url --all origin)
          if ($LASTEXITCODE -ne 0 -or $arrRemoteUrls.Count -ne 1) {
              throw 'credential-policy: unable to resolve exactly one origin URL'
          }
          if ($arrRemoteUrls[0] -cne 'https://github.com/franklesniak/TerraformStyleGuide') {
              throw 'credential-policy: origin is not a credential-free GitHub HTTPS URL'
          }
          $arrHelpers = @(& $strGitPath config --local --get-all credential.helper)
          $intHelperExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (($intHelperExit -ne 0 -and $intHelperExit -ne 1) -or $arrHelpers.Count -ne 0) {
              throw 'credential-policy: a local credential helper is configured'
          }
          $arrAuthorizationKeys = @(& $strGitPath config --local --name-only --get-regexp '^http\..*\.extraheader$')
          $intAuthorizationExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (($intAuthorizationExit -ne 0 -and $intAuthorizationExit -ne 1) -or $arrAuthorizationKeys.Count -ne 0) {
              throw 'credential-policy: persisted HTTP authorization is configured'
          }

          $arrEffectiveConfig = @(& $strGitPath config --show-scope --name-only --list)
          $intEffectiveConfigExit = $LASTEXITCODE
          if ($intEffectiveConfigExit -ne 0 -or @($arrEffectiveConfig | Where-Object { $_ -cmatch '^(system|global)\s' }).Count -ne 0) {
              throw 'credential-policy: external Git configuration was not excluded'
          }

      - name: Set up locked Node.js runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) {
              $PSNativeCommandUseErrorActionPreference = $false
          }
          if (-not [string]::IsNullOrEmpty($env:GITHUB_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:GH_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:ACTIONS_RUNTIME_TOKEN)) {
              throw 'credential-policy: a token was projected into a code job'
          }
          $strVersion = '24.18.1'
          $strReviewedSha256 = 'D6C664DF3F3F61458E8C277585571328522D705166723A7C7823A9253A4D15A0'
          $strNodeRoot = [IO.Path]::Combine($env:RUNNER_TEMP, 'agent-validation-node')
          $strArchive = [IO.Path]::Combine($env:RUNNER_TEMP, 'agent-validation-node.tar.xz')
          if ([IO.Path]::Exists($strNodeRoot) -or [IO.Path]::Exists($strArchive)) {
              throw 'toolchain: runtime staging destination already exists'
          }
          $strCurlPath = @('/usr/bin/curl', '/bin/curl') |
              Where-Object { [IO.File]::Exists($_) } | Select-Object -First 1
          $strTarPath = @('/usr/bin/tar', '/bin/tar') |
              Where-Object { [IO.File]::Exists($_) } | Select-Object -First 1
          if ([string]::IsNullOrEmpty($strCurlPath) -or [string]::IsNullOrEmpty($strTarPath)) {
              throw 'toolchain: fixed download/extraction tools are unavailable'
          }
          $strUrl = "https://nodejs.org/dist/v$strVersion/node-v$strVersion-linux-x64.tar.xz"
          & $strCurlPath --silent --show-error --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 --retry-max-time 300 --output $strArchive $strUrl
          if ($LASTEXITCODE -ne 0) { throw "toolchain: download exited $LASTEXITCODE" }
          if ((Get-FileHash -LiteralPath $strArchive -Algorithm SHA256).Hash -cne $strReviewedSha256) {
              throw 'toolchain: official Node archive does not match the reviewed digest'
          }
          [void][IO.Directory]::CreateDirectory($strNodeRoot)
          & $strTarPath -xJf $strArchive -C $strNodeRoot --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw "toolchain: extraction exited $LASTEXITCODE" }
          $strNodePath = [IO.Path]::Combine($strNodeRoot, 'bin', 'node')
          $strNpmPath = [IO.Path]::Combine($strNodeRoot, 'bin', 'npm')
          if (-not [IO.File]::Exists($strNodePath) -or -not [IO.File]::Exists($strNpmPath)) {
              throw 'toolchain: verified runtime executables are missing'
          }
          $strObservedVersion = (& $strNodePath --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $strObservedVersion -cne "v$strVersion") {
              throw 'toolchain: verified runtime executable identity is wrong'
          }
          [IO.File]::AppendAllText($env:GITHUB_PATH,
              [IO.Path]::Combine($strNodeRoot, 'bin') + "`n", [Text.UTF8Encoding]::new($false))

      - name: Verify locked Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          expected_node="$(node -p 'require("./package.json").engines.node')"
          expected_npm="$(node -p 'require("./package.json").engines.npm')"
          test "$(node --version)" = "v${expected_node}"
          test "$(npm --version)" = "${expected_npm}"

      - name: Resolve trusted workflow-run finalization time
        id: resolve_run_time
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_BASE_REVISION: ${{ github.event_name == 'push' && github.event.before || '' }}
          RUN_HEAD_REVISION: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          RUN_HEAD_REF_NAME: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}
          RUN_HEAD_REF: ${{ github.event_name == 'pull_request_target' && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
          RUN_HEAD_REPOSITORY: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          node .github/workflows/Resolve-AgentInstructionFinalizationTime.mjs

      - name: Fetch pull request head as data
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          [[ "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          # An unexpected non-fast-forward local ref must fail closed.
          git fetch --no-tags --no-recurse-submodules origin \
              "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          fetched_head="$(git rev-parse --verify \
            "refs/remotes/pull/${PR_NUMBER}/head^{commit}")"
          test "${fetched_head}" = "${PR_HEAD_SHA}"
          git diff --quiet --no-ext-diff
          git diff --cached --quiet --no-ext-diff

      - name: Fetch existing push range base as data
        if: >-
          github.event_name == 'push' &&
          !github.event.created &&
          !github.event.deleted
        shell: bash
        env:
          RANGE_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          [[ "${RANGE_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${RANGE_BASE_SHA}" != "0000000000000000000000000000000000000000"
          git fetch --no-tags --no-recurse-submodules origin "${RANGE_BASE_SHA}"
          fetched_base="$(git rev-parse --verify "${RANGE_BASE_SHA}^{commit}")"
          test "${fetched_base}" = "${RANGE_BASE_SHA}"
          git diff --quiet --no-ext-diff
          git diff --cached --quiet --no-ext-diff

      - name: Resolve exact public merge source
        id: resolve_automated_merge_source
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch &&
          !github.event.created &&
          !github.event.deleted
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RANGE_HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          [[ "${RANGE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const objectId = /^[0-9a-f]{40}$/u;
          const positiveInteger = /^[1-9][0-9]*$/u;
          const apiUrl = process.env.API_URL;
          const repository = process.env.REPOSITORY;
          const head = process.env.RANGE_HEAD_SHA;
          const defaultBranch = process.env.DEFAULT_BRANCH;
          const output = process.env.GITHUB_OUTPUT;
          if (!apiUrl || !repository || !objectId.test(head ?? '') ||
              !defaultBranch || !output) {
            throw new Error('Automated merge-source inputs are unavailable or invalid.');
          }

          const records = [];
          const apiRoot = apiUrl.replace(/\/+$/u, '');
          for (let page = 1; page <= 20; page += 1) {
            const url = new URL(
              `${apiRoot}/repos/${repository}/commits/${head}/pulls?per_page=100&page=${page}`,
            );
            const response = await fetch(url, {
              headers: {
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) {
              throw new Error(`Associated pull-request lookup failed: ${response.status}.`);
            }
            const pageRecords = await response.json();
            if (!Array.isArray(pageRecords)) {
              throw new Error('Associated pull-request response is not an array.');
            }
            records.push(...pageRecords);
            const link = response.headers.get('link') ?? '';
            if (!link.includes('rel="next"')) {
              break;
            }
            if (page === 20) {
              throw new Error('Associated pull-request pagination exceeded 20 pages.');
            }
          }

          const matches = records.filter((pull) =>
            pull?.merged_at &&
            pull?.state === 'closed' &&
            pull?.base?.repo?.full_name === repository &&
            pull?.base?.ref === defaultBranch &&
            pull?.merge_commit_sha === head &&
            Number.isSafeInteger(pull?.number) &&
            pull.number > 0 &&
            objectId.test(pull?.head?.sha ?? '') &&
            pull.head.sha !== head,
          );
          if (matches.length > 1) {
            throw new Error('More than one exact automated merge source matched the pushed head.');
          }
          if (matches.length === 0) {
            appendFileSync(output, 'source_revision=\npull_number=\n', 'utf8');
          } else {
            const match = matches[0];
            if (!positiveInteger.test(String(match.number))) {
              throw new Error('The automated merge pull-request number is invalid.');
            }
            appendFileSync(
              output,
              `source_revision=${match.head.sha}\npull_number=${match.number}\n`,
              'utf8',
            );
          }
          NODE

      - name: Fetch exact public merge source as data
        if: steps.resolve_automated_merge_source.outputs.source_revision != ''
        shell: bash
        env:
          SOURCE_REVISION: >-
            ${{ steps.resolve_automated_merge_source.outputs.source_revision }}
          PR_NUMBER: ${{ steps.resolve_automated_merge_source.outputs.pull_number }}
          MERGE_RESULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${MERGE_RESULT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          source_ref="refs/remotes/automated-merge/${PR_NUMBER}/head"
          git check-ref-format "${source_ref}"
          git fetch --no-tags --no-recurse-submodules origin \
              "refs/pull/${PR_NUMBER}/head:${source_ref}"
          fetched_source="$(git rev-parse --verify "${source_ref}^{commit}")"
          test "${fetched_source}" = "${SOURCE_REVISION}"
          IFS=' ' read -r -a head_and_parents <<< "$(
            git rev-list --parents -n 1 "${MERGE_RESULT_SHA}"
          )"
          test "${head_and_parents[0]}" = "${MERGE_RESULT_SHA}"
          (( ${#head_and_parents[@]} >= 2 ))
          if (( ${#head_and_parents[@]} > 2 )); then
            printf '%s\n' "${head_and_parents[@]:1}" |
              grep -Fqx -- "${SOURCE_REVISION}"
          fi
          git diff --quiet --no-ext-diff
          git diff --cached --quiet --no-ext-diff

      - name: Fetch default-branch published baseline as data
        id: fetch_default_baseline
        if: >-
          (github.event_name == 'push' &&
          github.event.created &&
          github.ref_name != github.event.repository.default_branch) ||
          (github.event_name == 'workflow_dispatch' &&
          steps.resolve_run_time.outputs.new_ref == 'true' &&
          github.ref_name != github.event.repository.default_branch)
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          default_ref="refs/heads/${DEFAULT_BRANCH}"
          remote_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          git check-ref-format "${default_ref}"
          git check-ref-format "${remote_ref}"
          git fetch --no-tags --no-recurse-submodules origin \
              "${default_ref}:${remote_ref}"
          fetched_baseline="$(git rev-parse --verify "${remote_ref}^{commit}")"
          [[ "${fetched_baseline}" =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "${fetched_baseline}" >> "${GITHUB_OUTPUT}"
          git diff --quiet --no-ext-diff
          git diff --cached --quiet --no-ext-diff

      - name: Fetch manual publication range base as data
        if: >-
          github.event_name == 'workflow_dispatch' &&
          steps.resolve_run_time.outputs.new_ref == 'false'
        shell: bash
        env:
          RANGE_BASE_SHA: ${{ steps.resolve_run_time.outputs.base_revision }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          [[ "${RANGE_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${RANGE_BASE_SHA}" != "0000000000000000000000000000000000000000"
          git fetch --no-tags --no-recurse-submodules origin "${RANGE_BASE_SHA}"
          fetched_base="$(git rev-parse --verify "${RANGE_BASE_SHA}^{commit}")"
          test "${fetched_base}" = "${RANGE_BASE_SHA}"
          git diff --quiet --no-ext-diff
          git diff --cached --quiet --no-ext-diff

      - name: Validate parser manifests as inert data
        shell: bash
        env:
          TRUSTED_REVISION: ${{ github.sha }}
          INPUT_REVISION: >-
            ${{ github.event_name == 'pull_request_target' &&
              github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          node .github/workflows/Test-AgentInstructionParserManifest.mjs --repository-root . --trusted-revision "${TRUSTED_REVISION}" --input-revision "${INPUT_REVISION}" --self-test

      - name: Install locked Markdown parser
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          npm ci --ignore-scripts --no-audit --fund=false --include=dev --package-lock=true

      - name: Validate instruction capacity and capabilities
        shell: pwsh
        env:
          AGENT_INSTRUCTION_INPUT_REVISION: >-
            ${{ github.event_name == 'pull_request_target' &&
              github.event.pull_request.head.sha ||
              github.event_name == 'push' && github.sha ||
              github.event_name == 'workflow_dispatch' && github.sha || '' }}
          AGENT_INSTRUCTION_RANGE_BASE: >-
            ${{ github.event_name == 'pull_request_target' &&
              github.event.pull_request.base.sha ||
              github.event_name == 'push' &&
              (!github.event.created ||
              github.ref_name == github.event.repository.default_branch) &&
              github.event.before ||
              (github.event_name == 'push' &&
              github.event.created &&
              github.ref_name != github.event.repository.default_branch) &&
              steps.fetch_default_baseline.outputs.revision ||
              github.event_name == 'workflow_dispatch' &&
              steps.resolve_run_time.outputs.new_ref == 'true' &&
              github.ref_name != github.event.repository.default_branch &&
              steps.fetch_default_baseline.outputs.revision ||
              github.event_name == 'workflow_dispatch' &&
              steps.resolve_run_time.outputs.base_revision || '' }}
          AGENT_INSTRUCTION_RANGE_HEAD: >-
            ${{ github.event_name == 'pull_request_target' &&
              github.event.pull_request.head.sha ||
              github.event_name == 'push' && github.sha ||
              github.event_name == 'workflow_dispatch' && github.sha || '' }}
          AGENT_INSTRUCTION_RANGE_IS_NEW_REF: >-
            ${{ (github.event_name == 'push' &&
              github.ref_name == github.event.repository.default_branch &&
              github.event.created) ||
              (github.event_name == 'workflow_dispatch' &&
              steps.resolve_run_time.outputs.new_ref == 'true' &&
              github.ref_name == github.event.repository.default_branch) || false }}
          AGENT_INSTRUCTION_RANGE_COMPARISON_MODE: >-
            ${{ ((github.event_name == 'push' &&
              !github.event.created) ||
              (github.event_name == 'workflow_dispatch' &&
              steps.resolve_run_time.outputs.new_ref == 'false')) &&
              'PublishedEndpoints' || 'MergeBase' }}
          AGENT_INSTRUCTION_AUTOMATED_MERGE_SOURCE: >-
            ${{ steps.resolve_automated_merge_source.outputs.source_revision || '' }}
          AGENT_INSTRUCTION_TRUSTED_FINALIZATION_TIMESTAMP: >-
            ${{ steps.resolve_run_time.outputs.timestamp }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrEmpty($env:GITHUB_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:GH_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:ACTIONS_RUNTIME_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:GIT_CONFIG_COUNT) -or
              -not [string]::IsNullOrEmpty($env:GIT_CONFIG_PARAMETERS)) {
              throw 'credential-policy: unexpected credential or Git configuration channel'
          }
          ./.github/workflows/Test-AgentInstructions.ps1 -SelfTest `
          -InputRevision $env:AGENT_INSTRUCTION_INPUT_REVISION `
          -RangeBaseRevision $env:AGENT_INSTRUCTION_RANGE_BASE `
          -RangeHeadRevision $env:AGENT_INSTRUCTION_RANGE_HEAD `
          -RangeIsNewRef:([bool]::Parse($env:AGENT_INSTRUCTION_RANGE_IS_NEW_REF)) `
          -RangeComparisonMode `
          $env:AGENT_INSTRUCTION_RANGE_COMPARISON_MODE `
          -AutomatedMergeSourceRevision `
          $env:AGENT_INSTRUCTION_AUTOMATED_MERGE_SOURCE `
          -TrustedFinalizationTimestamp `
          $env:AGENT_INSTRUCTION_TRUSTED_FINALIZATION_TIMESTAMP
