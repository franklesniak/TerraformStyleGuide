name: Markdown Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # No scopes and no actions, for the same reasons build.yml's verify job has
  # neither, and the second is not optional once the first is understood.
  #
  # This job runs repository-controlled code: Validate-WorkflowPolicy.mjs is
  # executed out of the checkout, so a pull request that rewrites it runs the
  # rewritten one; lint-nested-markdown.js is the whole of the second lint
  # phase; and npm installs and executes a hundred-odd packages. Both actions
  # this job used to declare registered post steps that run after all of that.
  #
  # permissions: {} does not reach those post steps. ACTIONS_RUNTIME_TOKEN
  # comes from the job's system connection rather than the permissions map --
  # NodeScriptActionHandler assigns it unconditionally, before deciding whether
  # it is running an action's pre, main or post script -- so any JavaScript
  # action here is a process holding a credential this job cannot revoke, and a
  # descendant left behind by the lint phases can read it out of that process
  # or simply overwrite the post script on disk before it runs.
  #
  # Today that dead-ends: this is a separate workflow, so it is a separate run
  # with its own artifact namespace and no artifacts in it. It stops
  # dead-ending at #22, which invokes this file through workflow_call from
  # build.yml -- same run, same artifact namespace, alongside the writer. So it
  # is removed here rather than left for the change that has to do everything
  # else.
  markdownlint:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Acquire triggering revision and pinned toolchain without an action
        id: acquire
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) {
              $PSNativeCommandUseErrorActionPreference = $false
          }

          # Read from the environment rather than expanded as a workflow
          # expression, because no governed script step in this repository
          # contains an expression at all.
          $strServerUrl = $env:GITHUB_SERVER_URL
          $strRepository = $env:GITHUB_REPOSITORY
          $strSha = $env:GITHUB_SHA
          if ($strServerUrl -cne 'https://github.com') {
              throw 'acquire: the runner named an unexpected server'
          }
          if ($strRepository -cnotmatch '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$') {
              throw 'acquire: the triggering repository is not a plain owner/name pair'
          }
          if ($strSha -cnotmatch '^[0-9a-f]{40}$') {
              throw 'acquire: the triggering revision is not a full commit hash'
          }
          if (@([System.IO.Directory]::EnumerateFileSystemEntries($PWD.Path)).Count -ne 0) {
              throw 'acquire: the workspace is not empty'
          }

          # Resolved from a fixed candidate list rather than by name. Nothing has
          # executed in this step yet, so name resolution is not attacker-
          # influenced here -- but PowerShell aliases curl and wget to
          # Invoke-WebRequest on the Desktop edition, this repository already
          # pins the Git executable this way in the verify step, and relying on
          # an alias being absent is a property of the host rather than
          # something this file asserts. Constant, so nothing later can rebind
          # it.
          $strResolvedGit = @('/usr/bin/git', '/bin/git') | Where-Object { [System.IO.File]::Exists($_) } | Select-Object -First 1
          if ([string]::IsNullOrEmpty($strResolvedGit)) { throw 'acquire: Git was not resolved as an application' }
          New-Variable -Name strGitPath -Value $strResolvedGit -Option Constant
          $strResolvedCurl = @('/usr/bin/curl', '/bin/curl') | Where-Object { [System.IO.File]::Exists($_) } | Select-Object -First 1
          $strResolvedTar = @('/usr/bin/tar', '/bin/tar') | Where-Object { [System.IO.File]::Exists($_) } | Select-Object -First 1
          if ([string]::IsNullOrEmpty($strResolvedCurl) -or [string]::IsNullOrEmpty($strResolvedTar)) { throw 'acquire: curl or tar was not resolved as an application' }
          New-Variable -Name strCurlPath -Value $strResolvedCurl -Option Constant
          New-Variable -Name strTarPath -Value $strResolvedTar -Option Constant

          & $strGitPath init --quiet .
          if ($LASTEXITCODE -ne 0) { throw "acquire: git init exited $LASTEXITCODE" }
          & $strGitPath remote add origin "$strServerUrl/$strRepository"
          if ($LASTEXITCODE -ne 0) { throw "acquire: git remote add exited $LASTEXITCODE" }
          & $strGitPath fetch --depth 1 --no-tags --no-recurse-submodules origin $strSha
          if ($LASTEXITCODE -ne 0) { throw "acquire: git fetch exited $LASTEXITCODE" }
          & $strGitPath checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "acquire: git checkout exited $LASTEXITCODE" }
          $strHead = (& $strGitPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $strHead -cne $strSha) {
              throw 'acquire: the checked out revision is not the triggering revision'
          }

          # The Node distribution is fetched here rather than by setup-node.
          # The archive URL and its expected digest are reviewed constants, so
          # nothing here trusts what the server returns -- which is a stronger
          # supply assertion than the action carried, since this repository
          # never verified anything setup-node downloaded. The step already
          # performs network I/O in any case: npm ci fetches the whole
          # dependency tree a few lines below.
          $strNodeUrl = 'https://nodejs.org/dist/v24.18.1/node-v24.18.1-linux-x64.tar.xz'
          $strReviewedNodeSha256 = 'D6C664DF3F3F61458E8C277585571328522D705166723A7C7823A9253A4D15A0'
          $strNodeRoot = [System.IO.Path]::Combine($env:RUNNER_TEMP, 'node24')
          $strArchivePath = [System.IO.Path]::Combine($env:RUNNER_TEMP, 'node24.tar.xz')
          & $strCurlPath --silent --show-error --fail --location --proto '=https' --tlsv1.2 --output $strArchivePath $strNodeUrl
          if ($LASTEXITCODE -ne 0) { throw "acquire: node download exited $LASTEXITCODE" }
          $strObservedNodeSha256 = (Get-FileHash -LiteralPath $strArchivePath -Algorithm SHA256).Hash
          if ($strObservedNodeSha256 -cne $strReviewedNodeSha256) {
              throw 'acquire: the Node archive does not match the reviewed digest'
          }
          [void][System.IO.Directory]::CreateDirectory($strNodeRoot)
          & $strTarPath -xJf $strArchivePath -C $strNodeRoot --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw "acquire: node extraction exited $LASTEXITCODE" }
          Write-Host "acquire: revision $strSha and the reviewed Node distribution"

      - name: Install, validate policy, and lint both Markdown surfaces
        id: validate-and-lint
        shell: pwsh
        working-directory: .github/workflows
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) {
              $PSNativeCommandUseErrorActionPreference = $false
          }

          # Fixed paths into the distribution the previous step downloaded and
          # verified against a reviewed digest, rather than a PATH lookup.
          # Get-Command consults the command table and PATH, and this is the
          # step that runs repository-controlled code, so resolving through
          # either would let that code choose which node runs. The bin
          # directory is still prepended to PATH because npm's shim resolves
          # its interpreter through env.
          $strNodeRoot = [System.IO.Path]::Combine($env:RUNNER_TEMP, 'node24')
          $strNodePath = [System.IO.Path]::Combine($strNodeRoot, 'bin', 'node')
          $strNpmPath = [System.IO.Path]::Combine($strNodeRoot, 'bin', 'npm')
          if (-not [System.IO.File]::Exists($strNodePath) -or -not [System.IO.File]::Exists($strNpmPath)) {
              throw 'toolchain: the reviewed Node distribution is not present'
          }
          $env:PATH = [System.IO.Path]::Combine($strNodeRoot, 'bin') + [System.IO.Path]::PathSeparator + $env:PATH
          $strNodeVersion = (& $strNodePath --version).Trim()
          $intNodeVersionExit = $LASTEXITCODE
          $strNpmVersion = (& $strNpmPath --version).Trim()
          $intNpmVersionExit = $LASTEXITCODE
          if ($intNodeVersionExit -ne 0 -or $strNodeVersion -cne 'v24.18.1') {
              throw "toolchain: node version check failed with exit $intNodeVersionExit"
          }
          if ($intNpmVersionExit -ne 0 -or $strNpmVersion -cne '11.16.0') {
              throw "toolchain: npm version check failed with exit $intNpmVersionExit"
          }
          Write-Host "Node executable: $strNodePath ($strNodeVersion)"
          Write-Host "npm executable: $strNpmPath ($strNpmVersion)"

          # Reviewed baseline. The before/after comparison further below proves
          # only that npm ci left these files alone; it cannot detect metadata
          # that was already altered at review time. This gate runs before
          # installation so unreviewed scripts are never installed and never run.
          $strReviewedPackageHash = 'E206CDB3562F0397E8EED7FB2C2586269A1F5335CDFF2906DA8D5E070426321E'
          $strReviewedLockHash = '277F7168AB3A4F1F7A2565DE13191D64B1572E7CB92B67B0972B3242BD4DE062'
          $strPackageBefore = (Get-FileHash -LiteralPath package.json -Algorithm SHA256).Hash
          $strLockBefore = (Get-FileHash -LiteralPath package-lock.json -Algorithm SHA256).Hash
          if ($strPackageBefore -cne $strReviewedPackageHash -or $strLockBefore -cne $strReviewedLockHash) {
              throw 'supply: package metadata does not match the reviewed supply digest'
          }

          # npm reads .npmrc from the project directory before it runs anything,
          # and script-shell there replaces the interpreter for every npm run. A
          # pull request can add one without altering either reviewed digest or
          # any governed workflow, after which both lint phases exit zero with the
          # command echoed and no linter ever executed. No .npmrc is reviewed in
          # this repository, so any is refused here, ahead of installation, so npm
          # never reads one.
          foreach ($strNpmConfigPath in @('.npmrc', '../.npmrc', '../../.npmrc')) {
              if (Test-Path -LiteralPath $strNpmConfigPath) {
                  throw 'supply: repository-controlled npm configuration is present'
              }
          }

          # The reviewed digests above cover what is installed, not what the lint
          # actually does. Both lint phases execute from the checkout: the rule
          # configuration decides which rules run at all, and the nested-fence
          # helper is the whole of the second phase. A pull request editing either
          # keeps every npm command string, every captured status, and every
          # digest intact while both phases report zero errors over nothing.
          $strReviewedLintConfigHash = '5EB07BF7F30829E0091E82F235A96FDBA21BE1EF1160CA1E22CDBE8D82DA5300'
          $strReviewedLintHelperHash = '4EEFEC7AFBA1C79809D916365B2EB3E2EA17AA482593338492A10D6DDA5E2031'
          $strLintConfigHash = (Get-FileHash -LiteralPath .markdownlint.jsonc -Algorithm SHA256).Hash
          $strLintHelperHash = (Get-FileHash -LiteralPath lint-nested-markdown.js -Algorithm SHA256).Hash
          if ($strLintConfigHash -cne $strReviewedLintConfigHash -or $strLintHelperHash -cne $strReviewedLintHelperHash) {
              throw 'supply: lint configuration or helper does not match the reviewed digest'
          }

          # Taken here, before npm ci and therefore before any third-party code
          # in this job has executed at all. Moving the policy validator below
          # the lint phases closed one exposure and opened another: the linters
          # now run first, so a compromised package in the pinned tree could
          # rewrite the two workflow files before the validator opens them, and
          # the step digests would not notice -- they cover run: bodies, not
          # job permissions, uses: keys, or triggers.
          #
          # Deliberately not re-compared in PowerShell just before the
          # validator. That would be the same check/use shape this step was
          # just corrected for: a writer already spawned by a linter can act
          # between the comparison and the validator's own read. Instead the
          # baseline is handed to the validator, which hashes the text it
          # actually parsed. A swap before its read produces a mismatch; a swap
          # afterwards cannot reach content it already holds. There is no
          # interval to exploit rather than a short one.
          $env:T1_EXPECTED_BUILD_DIGEST = (Get-FileHash -LiteralPath ./build.yml -Algorithm SHA256).Hash
          $env:T1_EXPECTED_MARKDOWN_DIGEST = (Get-FileHash -LiteralPath ./markdownlint.yml -Algorithm SHA256).Hash

          $boolCiExisted = Test-Path Env:CI
          $strPriorCi = $env:CI
          try {
              $env:CI = 'true'
              & $strNpmPath ci --ignore-scripts --no-audit --no-fund
              $intInstallExit = $LASTEXITCODE
          } finally {
              if ($boolCiExisted) {
                  $env:CI = $strPriorCi
              } else {
                  Remove-Item Env:CI -ErrorAction SilentlyContinue
              }
          }
          if ($intInstallExit -ne 0) { throw "npm-ci: native exit $intInstallExit" }

          $strPackageAfterInstall = (Get-FileHash -LiteralPath package.json -Algorithm SHA256).Hash
          $strLockAfterInstall = (Get-FileHash -LiteralPath package-lock.json -Algorithm SHA256).Hash
          if ($strPackageAfterInstall -cne $strPackageBefore -or $strLockAfterInstall -cne $strLockBefore) {
              throw 'npm-ci: package metadata changed during frozen installation'
          }

          # Re-taken after installation and before the phases that read them.
          # This asserts one specific thing and no more: that npm ci did not
          # disturb the two lint assets between the gate further above and the
          # linters below. It is not a boundary against a concurrent writer --
          # Get-FileHash reads and closes, so any process still running could
          # write the file after the hash and before the linter opens it. The
          # boundary is established by ordering instead: no repository-controlled
          # program runs between the gate and the linters. npm ci installs the
          # lockfile-pinned tree with --ignore-scripts, and the policy validator,
          # which is repository-controlled and could otherwise leave a writer
          # behind, now runs after both phases rather than before them.
          $strLintConfigAfterPolicy = (Get-FileHash -LiteralPath .markdownlint.jsonc -Algorithm SHA256).Hash
          $strLintHelperAfterPolicy = (Get-FileHash -LiteralPath lint-nested-markdown.js -Algorithm SHA256).Hash
          if ($strLintConfigAfterPolicy -cne $strReviewedLintConfigHash -or $strLintHelperAfterPolicy -cne $strReviewedLintHelperHash) {
              throw 'supply: lint configuration or helper changed after policy validation'
          }

          & $strNpmPath run lint:md
          $intOuterExit = $LASTEXITCODE
          Write-Host "outer-markdown native exit: $intOuterExit"

          & $strNpmPath run lint:md:nested
          $intNestedExit = $LASTEXITCODE
          Write-Host "nested-markdown native exit: $intNestedExit"

          # Last, deliberately. Placed before the linters, a hostile edit to this
          # repository-controlled script could spawn a process that outlives it
          # and rewrite the rule configuration or the nested-fence helper after
          # they were hashed but before the linters read them -- a check/use race
          # (CWE-367) that no re-hash can close, because the attacker chooses when
          # to write. Running it here leaves it no later reader to poison: its
          # only output is the status captured below, which the final check
          # asserts, and it could misreport that from any position in the step.
          & $strNodePath ./Validate-WorkflowPolicy.mjs ./build.yml ./markdownlint.yml
          $intPolicyExit = $LASTEXITCODE
          Write-Host "workflow-policy native exit: $intPolicyExit"

          $strPackageFinal = (Get-FileHash -LiteralPath package.json -Algorithm SHA256).Hash
          $strLockFinal = (Get-FileHash -LiteralPath package-lock.json -Algorithm SHA256).Hash
          if ($strPackageFinal -cne $strPackageBefore -or $strLockFinal -cne $strLockBefore) {
              throw 'validation: package metadata changed after installation or linting'
          }
          if ($intPolicyExit -ne 0 -or $intOuterExit -ne 0 -or $intNestedExit -ne 0) {
              throw 'validation: one or more policy or lint phases failed'
          }
